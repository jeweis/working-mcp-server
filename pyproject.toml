[project]
name = "working-mcp-server"
version = "0.1.0"
description = "Streamable HTTP programming MCP server with workspace and tool management"
readme = "README.md"
authors = [
    { name = "Jewei", email = "jewei@jeweis.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.3",
    "platformdirs>=4.13.5",
    "pydantic>=2.14.1",
    "starlette>=1.9.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
working-mcp-server = "working_mcp_server:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
